dns:
  enable: true
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - localhost.ptlogin2.qq.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.googleapis.com"
    - "+.googleapis.cn"
    - "rule-set:googlefcm-site"
    - "rule-set:cloudflare-site"
  use-hosts: true
  default-nameserver: [223.5.5.5#DIRECT]
  proxy-server-nameserver: ["https://dns.alidns.com/dns-query#DIRECT"]
  nameserver: ["https://cloudflare-dns.com/dns-query#M"]
  direct-nameserver: ["https://dns.alidns.com/dns-query#DIRECT"]
  nameserver-policy:
    "rule-set:microsoft-site": "https://cloudflare-dns.com/dns-query#Microsoft"
    "rule-set:cloudflare-site": "https://cloudflare-dns.com/dns-query#M"
    "rule-set:openai-site": "https://cloudflare-dns.com/dns-query#OpenAi"
    "rule-set:github-site": "https://cloudflare-dns.com/dns-query#GitHub"
    "rule-set:telegram-site": "https://cloudflare-dns.com/dns-query#Telegram"
    "rule-set:twitter-site": "https://cloudflare-dns.com/dns-query#Twitter"
    "rule-set:tiktok-site": "https://cloudflare-dns.com/dns-query#TikTok"
    "rule-set:youtube-site": "https://dns.google/dns-query#Google"
    "rule-set:googlefcm-site": "https://dns.google/dns-query#Google"
    "rule-set:google-site": "https://dns.google/dns-query#Google"
    "rule-set:speedtest-site": "https://cloudflare-dns.com/dns-query#M"
    "rule-set:steam-site": "https://cloudflare-dns.com/dns-query#Steam"
    "rule-set:huawei-site": "rcode://refused"
    "rule-set:codeberg-site": "https://cloudflare-dns.com/dns-query#GitHub"
tun:
  enable: true
  device: clash
  stack: gvisor
  dns-hijack: ["0.0.0.0:53"]
  auto-route: true
  udp-timeout: 60
  mtu: 1500
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

proxy-groups:
  - {type: select, name: M, proxies: [JP, SG, US, HK]}
  - {type: select, name: Default, proxies: [REJECT, DIRECT, M]}
  - {type: select, name: Google, proxies: [US, JP, SG, HK]}
  - {type: fallback, name: Relay, include-all-proxies: true, filter: "(?i).*(JP|SG|US|HK).*", url: "http://www.gstatic.com/generate_204", interval: 30}
  - {type: select, name: OpenAi, proxies: [JP, SG, US, HK]}
  - {type: select, name: Telegram, proxies: [JP, SG, US, HK]}
  - {type: select, name: Steam, proxies: [DIRECT, JP, SG, US, HK]}
  - {type: select, name: PikPak, proxies: [SG_load-balance, HK_load-balance, SG, JP, US, HK]}
  - {type: select, name: GitHub, proxies: [JP, SG, US, HK]}
  - {type: select, name: Microsoft, proxies: [DIRECT, JP, SG, US, HK]}
  - {type: select, name: TikTok, proxies: [JP]}
  - {type: select, name: Twitter, proxies: [US]}
  - {type: select, name: Youtube, include-all-proxies: true, filter: "(?i)^(?=.*(US))(?!.*(gemini|US-G)).*$"}
  - {type: select, name: AD, proxies: [REJECT-DROP, PASS]}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: HK, filter: "(?i)^(?=.*(HK))(?!.*(UDP|HY2)).*$"}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: JP, filter: "(?i).*(JP).*"}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: SG, filter: "(?i).*(SG).*"}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: US, filter: "(?i)^(?!.*US-G).*US.*"}
  - {type: load-balance, url: "https://www.gstatic.com/generate_204", interval: 30, timeout: 3000, max-failed-times: 3, include-all-proxies: true, strategy: round-robin, hidden: true, name: SG_load-balance, filter: "(?i).*(SG).*"}
  - {type: load-balance, url: "https://www.gstatic.com/generate_204", interval: 30, timeout: 3000, max-failed-times: 3, include-all-proxies: true, strategy: round-robin, hidden: true, name: HK_load-balance, filter: "(?i).*(HK).*"}
